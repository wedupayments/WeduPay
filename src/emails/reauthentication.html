<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeduPay Security</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td align="center" style="padding: 40px 20px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.08);">

          <tr>
            <td style="background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); padding: 40px 30px; text-align: center;">
              <a href="https://wedupay.com"><img src="https://wedupay.com/logo.png" alt="WeduPay" width="160" height="44" style="display: block; max-width: 160px; height: auto; border: 0; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic;"></a>
              <h1 style="margin: 0; color: #0f172a; font-size: 26px; font-weight: 800;">Security Confirmation</h1>
            </td>
          </tr>

          <tr>
            <td style="padding: 40px 30px;">
              <p style="margin: 0 0 24px 0; color: #475569; font-size: 16px; line-height: 1.6;">
                Please use the token below to complete your request:
              </p>

              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin: 0 auto 24px auto;">
                <tr>
                  <td style="padding: 16px 32px; background-color: #fef2f2; border-radius: 12px; text-align: center;">
                    <p style="margin: 0 0 4px 0; color: #991b1b; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">Token</p>
                    <p style="margin: 0; color: #dc2626; font-size: 28px; font-weight: 800; letter-spacing: 6px; font-family: monospace;">{{ .Token }}</p>
                  </td>
                </tr>
              </table>

              <p style="margin: 0; color: #94a3b8; font-size: 13px; text-align: center;">
                This token is valid for a limited time.
              </p>
            </td>
          </tr>

          <tr>
            <td style="padding: 24px 30px; background-color: #fafbfc;">
              <p style="margin: 0 0 12px 0; color: #475569; font-size: 12px; font-style: italic;">— The WeduPay Team</p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="padding: 10px 14px; background-color: #ffffff; border-radius: 6px; border: 1px solid #e2e8f0;">
                    <p style="margin: 0; color: #0f172a; font-size: 13px; font-weight: 700;">Nyasha Ushewokunze</p>
                    <p style="margin: 2px 0 0 0; color: #64748b; font-size: 11px;">Co-Founder</p>
                  </td>
                  <td style="width: 12px;"></td>
                  <td style="padding: 10px 14px; background-color: #ffffff; border-radius: 6px; border: 1px solid #e2e8f0;">
                    <p style="margin: 0; color: #0f172a; font-size: 13px; font-weight: 700;">Tapiwa Timba</p>
                    <p style="margin: 2px 0 0 0; color: #64748b; font-size: 11px;">Co-Founder</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td style="padding: 20px 30px; text-align: center;">
              <p style="margin: 0; color: #94a3b8; font-size: 10px;">© WeduPay. All rights reserved.</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
