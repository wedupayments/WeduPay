<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Waitlist Signup - WeduPay Admin</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif; background-color: #f8fafc;">
  <table role="presentation" style="width: 100%; border-collapse: collapse;">
    <tr>
      <td align="center" style="padding: 40px 20px;">
        <table role="presentation" style="max-width: 600px; width: 100%; background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.08);">
          
          <!-- Header -->
          <tr>
            <td style="background: linear-gradient(135deg, #11d473 0%, #0ea85a 100%); padding: 30px; text-align: center;">
              <h1 style="margin: 0; color: #0f172a; font-size: 24px; font-weight: 800;">🎉 New Waitlist Signup</h1>
            </td>
          </tr>
          
          <!-- Content -->
          <tr>
            <td style="padding: 40px 30px;">
              <p style="margin: 0 0 24px 0; color: #475569; font-size: 16px; line-height: 1.6;">
                A new user has joined the WeduPay waitlist:
              </p>
              
              <!-- User Details Card -->
              <table role="presentation" style="width: 100%; background-color: #f1f5f9; border-radius: 12px; margin-bottom: 24px;">
                <tr>
                  <td style="padding: 24px;">
                    <table role="presentation" style="width: 100%;">
                      <tr>
                        <td style="padding-bottom: 16px; border-bottom: 1px solid #e2e8f0;">
                          <p style="margin: 0 0 4px 0; color: #64748b; font-size: 12px; font-weight: 600; text-transform: uppercase;">Email</p>
                          <p style="margin: 0; color: #0f172a; font-size: 16px; font-weight: 600;">{{email}}</p>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding-top: 16px; padding-bottom: 16px; border-bottom: 1px solid #e2e8f0;">
                          <p style="margin: 0 0 4px 0; color: #64748b; font-size: 12px; font-weight: 600; text-transform: uppercase;">Type</p>
                          <p style="margin: 0; color: #0f172a; font-size: 16px; font-weight: 600;">
                            <span style="display: inline-block; padding: 4px 12px; background-color: #11d473; color: #0f172a; border-radius: 6px; font-size: 14px;">{{type}}</span>
                          </p>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding-top: 16px;">
                          <p style="margin: 0 0 4px 0; color: #64748b; font-size: 12px; font-weight: 600; text-transform: uppercase;">Name</p>
                          <p style="margin: 0; color: #0f172a; font-size: 16px; font-weight: 600;">{{name}}</p>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
              
              <!-- Stats -->
              <table role="presentation" style="width: 100%; margin-bottom: 24px;">
                <tr>
                  <td style="padding: 16px; background-color: #dcfce7; border-radius: 12px; text-align: center;">
                    <p style="margin: 0; color: #166534; font-size: 24px; font-weight: 800;">{{totalWaitlist}}</p>
                    <p style="margin: 4px 0 0 0; color: #166534; font-size: 14px; font-weight: 600;">Total Waitlist Signups</p>
                  </td>
                </tr>
              </table>
              
              <table role="presentation" style="margin: 0 auto;">
                <tr>
                  <td>
                    <a href="{{adminUrl}}" style="display: inline-block; background-color: #11d473; color: #0f172a; text-decoration: none; padding: 16px 40px; border-radius: 12px; font-weight: 700; font-size: 16px;">
                      View in Admin Dashboard
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          
          <!-- Footer -->
          <tr>
            <td style="background-color: #f8fafc; padding: 30px; text-align: center; border-top: 1px solid #e2e8f0;">
              <p style="margin: 0; color: #94a3b8; font-size: 12px;">
                This is an automated notification from WeduPay.
              </p>
            </td>
          </tr>
          
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
