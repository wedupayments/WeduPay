services:
  app:
    build:
      context: .
      target: deps # Use the deps stage or a simple node image for dev
    image: wedupay-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
    env_file:
      - .env.local
    command: npm run dev
